<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${titulo}"></title>

    <!-- Bootstrap CSS -->
<!--    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"-->
<!--          rel="stylesheet"-->
<!--          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"-->
<!--          crossorigin="anonymous">-->

    <!-- Bootstrap CSS local -->
    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1 class="mb-4" th:text="${titulo}"></h1>

        <a href="/form" class="btn btn-primary my-3">Volver</a>

        <h2>Usuario</h2>
        <ul class="list-group mb-4">
            <li class="list-group-item"><strong>Id:</strong> <span th:text="${usuario.id}"></span></li>
            <li class="list-group-item"><strong>Código:</strong> <span th:text="${usuario.codigo}"></span></li>
            <li class="list-group-item"><strong>Nombre:</strong> <span th:text="${usuario.nombre}"></span></li>
            <li class="list-group-item"><strong>Apellido:</strong> <span th:text="${usuario.apellido}"></span></li>
            <li class="list-group-item"><strong>Username:</strong> <span th:text="${usuario.username}"></span></li>
            <li class="list-group-item"><strong>Password:</strong> <span th:text="${usuario.password}"></span></li>
            <li class="list-group-item"><strong>Correo:</strong> <span th:text="${usuario.email}"></span></li>
            <li class="list-group-item"><strong>Edad:</strong> <span th:text="${usuario.edad}"></span></li>
            <!-- Formatear la fecha de nacimiento -->
            <li class="list-group-item"><strong>Fecha de nacimiento:</strong> <span th:text="${#dates.format(usuario.fechaNacimiento, 'dd/MM/yyyy')}"></span></li>
            <li class="list-group-item"><strong>País Id:</strong> <span th:text="${usuario.pais.id}"></span></li>
            <li class="list-group-item"><strong>País Nombre:</strong> <span th:text="${usuario.pais.nombre}"></span></li>
            <li class="list-group-item"><strong>País Código:</strong> <span th:text="${usuario.pais.codigo}"></span></li>
            <li class="list-group-item"><strong>Habilitado:</strong> <span th:text="${usuario.habilitado}"></span></li>
            <li class="list-group-item"><strong>Género:</strong> <span th:text="${usuario.genero}"></span></li>
            <li class="list-group-item"><strong>Valor secreto:</strong> <span th:text="${usuario.valorSecreto}"></span></li>
        </ul>

        <h2>Roles</h2>
        <ul class="list-group mb-4">
            <li class="list-group-item" th:each="rol : ${usuario.roles}">
                <strong>Rol:</strong> <span th:text="${rol.id}"></span> - <span th:text="${rol.nombre}"></span>
            </li>
        </ul>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-9NDYKXKnL8Q5bZTnq1X54NROF1QDVkx1Ac3a5GR6aLp6H1WhSBgo4IuB/wXCoTW7"
            crossorigin="anonymous">
    </script>
</body>
</html>

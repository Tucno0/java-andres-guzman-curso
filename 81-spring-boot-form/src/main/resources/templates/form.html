<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${titulo}"></title>

<body>
    <div class="container mt-5">
        <h1 class="mb-4" th:text="${titulo}"></h1>

        <!--th:object="${usuario}" es usado para enlazar el formulario con el objeto usuario que se encuentra en el modelo.-->
        <form th:action="@{/form}" th:object="${usuario}" method="post">
            <div class="mb-3">
                <label for="codigo" class="form-label">Codigo:</label>
                <input type="text" id="codigo" th:field="*{codigo}" class="form-control"/>
                <!--<div style="color: red" th:if="${error != null && error.containsKey('codigo')}" th:text="${error.codigo}"></div>-->
                <div class="text-danger" th:if="${#fields.hasErrors('codigo')}" th:errors="*{codigo}">Error de validación</div>
            </div>

            <div class="mb-3">
                <label for="nombre" class="form-label">Nombre:</label>
                <input type="text" id="nombre" th:field="*{nombre}" class="form-control"/>
                <!--<div style="color: red" th:if="${error != null && error.containsKey('nombre')}" th:text="${error.nombre}"></div>-->
                <div class="text-danger" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}">Error de validación</div>
            </div>

            <div class="mb-3">
                <label for="apellido" class="form-label">Apellido:</label>
                <input type="text" id="apellido" th:field="*{apellido}" class="form-control"/>
                <!--div style="color: red" th:if="${error != null && error.containsKey('apellido')}" th:text="${error.apellido}"></div>-->
                <div class="text-danger" th:if="${#fields.hasErrors('apellido')}" th:errors="*{apellido}">Error de validación</div>
            </div>

            <div class="mb-3">
                <label for="username" class="form-label">Username:</label>
                <input type="text" id="username" th:field="*{username}" class="form-control"/>
                <!--<div style="color: red" th:if="${error != null && error.containsKey('username')}" th:text="${error.username}"></div>-->
                <div class="text-danger" th:if="${#fields.hasErrors('username')}" th:errors="*{username}">Error de validación</div>
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">Password:</label>
                <input type="password" id="password" th:field="*{password}" class="form-control"/>
                <!--<div style="color: red" th:if="${error != null && error.containsKey('password')}" th:text="${error.password}"></div>-->
                <div class="text-danger" th:if="${#fields.hasErrors('password')}" th:errors="*{password}">Error de validación</div>
            </div>

            <div class="mb-3">
                <label for="email" class="form-label">Correo:</label>
                <input type="email" id="email" th:field="*{email}" class="form-control"/>
                <!--<div style="color: red" th:if="${error != null && error.containsKey('email')}" th:text="${error.email}"></div>-->
                <div class="text-danger" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">Error de validación</div>
            </div>

            <div class="mb-3">
                <label for="edad" class="form-label">Edad:</label>
                <input type="text" id="edad" th:field="*{edad}" class="form-control"/>
                <div class="text-danger" th:if="${#fields.hasErrors('edad')}" th:errors="*{edad}">Error de validación</div>
            </div>

            <div class="mb-3">
                <label for="fechaNacimiento" class="form-label">Fecha de Nacimiento:</label>
                <input type="date" id="fechaNacimiento" th:field="*{fechaNacimiento}" placeholder="yyyy/MM/dd" class="form-control"/>
                <div class="text-danger" th:if="${#fields.hasErrors('fechaNacimiento')}" th:errors="*{fechaNacimiento}">Error de validación</div>
            </div>

    <!--                </select>-->
    <!--            </div>-->
    <!--            <div style="color: red" th:if="${#fields.hasErrors('pais')}" th:errors="*{pais}">Error de validación</div>-->
    <!--        </div>-->

            <div class="mb-3">
                <label for="pais" class="form-label">Pais:</label>
                <select id="pais" th:field="*{pais}" class="form-select">
                    <option value="">Seleccione un pais</option>
                    <option th:each="pais : ${listaPaises}" th:value="${pais.id}" th:text="${pais.nombre}"></option>
                </select>
                <div class="text-danger" th:if="${#fields.hasErrors('pais')}" th:errors="*{pais}">Error de validación</div>
            </div>

            <!--List<String>-->

    <!--            </div>-->
    <!--            <div style="color: red" th:if="${#fields.hasErrors('roles')}" th:errors="*{roles}">Error de validación</div>-->

    <!--            </div>-->
    <!--            <div style="color: red" th:if="${#fields.hasErrors('roles')}" th:errors="*{roles}">Error de validación</div>-->
    <!--        </div>-->

            <!--List<Role>-->
            <div class="mb-3">
                <label class="form-label">Roles:</label>
                <div th:each="role : ${listaRoles}">
                    <div class="form-check">
                        <input type="checkbox" th:field="*{roles}" th:value="${role.id}" th:checked="${#lists.contains(usuario.roles, role)}" class="form-check-input"/>
                        <label th:for="${#ids.prev('roles')}" th:text="${role.nombre}" class="form-check-label"></label>
                    </div>
                </div>
                <div class="text-danger" th:if="${#fields.hasErrors('roles')}" th:errors="*{roles}">Error de validación</div>
            </div>

            <!--Checkboxes con valores booleanos-->
            <div class="mb-3">
                <div class="form-check">
                    <input type="checkbox" id="habilitado" th:field="*{habilitado}" class="form-check-input"/>
                    <label for="habilitado" class="form-check-label">Habilitado:</label>
                </div>
            </div>

            <!--Radio buttons-->

            <!--Radio buttons con valores desde un List-->
            <div class="mb-3">
                <label class="form-label">Genero:</label>
                <div th:each="genero : ${generos}">
                    <div class="form-check">
                        <input type="radio" th:field="*{genero}" th:value="${genero}" class="form-check-input"/>
                        <label th:for="${#ids.prev('genero')}" th:text="${genero}" class="form-check-label"></label>
                    </div>
                </div>
                <div class="text-danger" th:if="${#fields.hasErrors('genero')}" th:errors="*{genero}">Error de validación</div>
            </div>

            <!--Input hidden-->
            <div>
                <input type="hidden" th:field="*{valorSecreto}" />
            </div>

            <div class="d-grid gap-2">
                <button type="submit" class="btn btn-primary">Submit</button>
            </div>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
            crossorigin="anonymous">
    </script>
</body>
</html>

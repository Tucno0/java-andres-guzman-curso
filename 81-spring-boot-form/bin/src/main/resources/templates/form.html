<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${titulo}"></title>
</head>

<body>
    <h1 th:text="${titulo}"></h1>

    <!--th:object="${usuario}" es usado para enlazar el formulario con el objeto usuario que se encuentra en el modelo.-->
    <form th:action="@{/form}" th:object="${usuario}" method="post">
        <div>
            <label for="nombre">Nombre:</label>
            <div>
                <input type="text" id="nombre" th:field="*{nombre}" />
            </div>
            <!--            <div style="color: red" th:if="${error != null && error.containsKey('nombre')}" th:text="${error.nombre}"></div>-->
            <div style="color: red" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}">Error de validación</div>
        </div>

        <div>
            <label for="apellido">Apellido:</label>
            <div>
                <input type="text" id="apellido" th:field="*{apellido}" />
            </div>
            <!--            <div style="color: red" th:if="${error != null && error.containsKey('apellido')}" th:text="${error.apellido}"></div>-->
            <div style="color: red" th:if="${#fields.hasErrors('apellido')}" th:errors="*{apellido}">Error de validación</div>
        </div>

        <div>
            <label for="username">Username:</label>
            <div>
                <input type="text" id="username" th:field="*{username}" />
            </div>
<!--            <div style="color: red" th:if="${error != null && error.containsKey('username')}" th:text="${error.username}"></div>-->
            <div style="color: red" th:if="${#fields.hasErrors('username')}" th:errors="*{username}">Error de validación</div>
        </div>

        <div>
            <label for="password">Password:</label>
            <div>
                <input type="password" id="password" th:field="*{password}" />
            </div>
<!--            <div style="color: red" th:if="${error != null && error.containsKey('password')}" th:text="${error.password}"></div>-->
            <div style="color: red" th:if="${#fields.hasErrors('password')}" th:errors="*{password}">Error de validación</div>
        </div>

        <div>
            <label for="email">Correo:</label>
            <div>
                <input type="text" id="email" th:field="*{email}" />
            </div>
<!--            <div style="color: red" th:if="${error != null && error.containsKey('email')}" th:text="${error.email}"></div>-->
            <div style="color: red" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">Error de validación</div>
        </div>

        <div>
            <input type="submit" value="Submit">
        </div>

    </form>
</body>
</html>

<!DOCTYPE html>
<html lang="es" xmlns:th="http://wwww.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Enviar parametros del Request HTTP GET - URL</title>
  </head>
  
  <body>
    <h1>Enviar parametros del Request HTTP GET - URL</h1>
	
	<ul>
		<li>
			<a th:href="@{/params/string(texto='Hola Andrés')}">
				/params/string?texto=Hola Andrés
			</a>
		</li>
		<li>
			<a th:href="@{/params/string(texto='Que tal John!')}">
				/params/string?texto=Que tal John
			</a>
		</li>
		<li>
			<a th:href="@{/params/mix-params(saludo='Como estas?', numero=7)}">
				/params/mix-params?saludo=Como estas&numero=7
			</a>
		</li>
		<li>
			<a th:href="@{/params/mix-params(saludo='Como estas?', numero=7)}">
				/params/mix-params-request?saludo=Como estas&numero=7
			</a>
		</li>
	</ul>
  </body>
</html>

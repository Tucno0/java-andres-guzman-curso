<!--ui:component es un componente de Facelets que permite reutilizar código en diferentes partes de la aplicación.-->
<!--En este caso, se utiliza para reutilizar el formulario de creación y edición de productos en diferentes vistas.-->
<ui:component xmlns="http://www.w3.org/1999/xhtml"
              xmlns:h="http://xmlns.jcp.org/jsf/html"
              xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
              xmlns:f="http://xmlns.jcp.org/jsf/core"
              xmlns:p="http://primefaces.org/ui">
    <h:form rendered="#{p:ifGranted('ADMIN')}" id="formProducto">
        <div class="p-field p-grid">
            <p:outputLabel value="#{msg['producto.nombre']}" for="nombre" class="p-col-fixed" style="width: 200px"/>

            <div class="p-col">
                <p:inputText id="nombre" value="#{productoController.producto.nombre}" label="Nombre"/>
            </div>
            <div class="p-col">
                <p:message for="nombre" style="color: red;"/>
            </div>
        </div>

        <div class="p-field p-grid">
            <p:outputLabel value="#{msg['producto.precio']}" for="precio" class="p-col-fixed" style="width: 200px"/>

            <div class="p-col">
                <p:inputText id="precio" value="#{productoController.producto.precio}" label="Precio"/>
            </div>
            <div class="p-col">
                <p:message for="precio" style="color: red;"/>
            </div>
        </div>

        <div class="p-field p-grid">
            <p:outputLabel value="#{msg['producto.sku']}" for="sku" class="p-col-fixed" style="width: 200px"/>

            <div class="p-col">
                <p:inputText id="sku" value="#{productoController.producto.sku}" label="Sku"/>
            </div>
            <div class="p-col">
                <p:message for="sku" style="color: red;"/>
            </div>

        </div>

        <div class="p-field p-grid">
            <p:outputLabel value="#{msg['producto.fechaRegistro']}" for="fechaRegistro" class="p-col-fixed" style="width: 200px"/>

            <div class="p-col">
                <p:datePicker id="fechaRegistro" value="#{productoController.producto.fechaRegistro}" pattern="yyyy-MM-dd"
                              label="Fecha de registro"
                              converterMessage="ndique la feccha con yyyy-MM-dd">
                    <!--f:convertDateTime se utiliza para formatear la fecha-->
                    <f:convertDateTime pattern="yyyy-MM-dd" type="localDate"/>
                    <!--f:passThroughAttribute sirve para pasar atributos HTML5 al componente de PrimeFaces-->
                    <f:passThroughAttribute name="type" value="date"/>
                </p:datePicker>
            </div>
            <div class="p-col">
                <p:message for="fechaRegistro" style="color: red;"/>
            </div>

        </div>

        <div class="p-field p-grid">
            <p:outputLabel value="#{msg['producto.categoria']}" for="sku" class="p-col-fixed" style="width: 200px"/>

            <div class="p-col">
                <p:selectOneMenu id="categoria" value="#{productoController.producto.categoria}">
                    <f:selectItem itemLabel="Seleccione una categoria" itemValue="#{null}"/>
                    <f:selectItems value="#{categorias}"
                                   var="cat"
                                   itemLabel="#{cat.nombre}"/>
                    <f:converter binding="#{categoriaConverter}"/>
                </p:selectOneMenu>
            </div>
            <div class="p-col">
                <p:message for="categoria" style="color: red;"/>
            </div>
        </div>

        <p:commandButton value="#{productoController.producto.id > 0 ? msg['producto.boton.editar'] : msg['producto.boton.crear']}"
                         styleClass="ui-button-success"
                         action="#{productoController.guardar}"
                         icon="pi pi-save"
                         update="@form tabla"/>
        <h:inputHidden value="#{productoController.producto.id}"/>
    </h:form>
</ui:component>

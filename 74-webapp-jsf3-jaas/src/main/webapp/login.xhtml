<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/layouts/main.xhtml">
    <!-- define sirve para definir un bloque de contenido que se puede reutilizar en otras vistas -->
    <ui:define name="content">
        <!--ifNoneGranted se utiliza para mostrar el formulario de creación y edición de productos solo si el usuario tiene el rol ADMIN-->
        <p:panel header="login" rendered="#{p:ifNoneGranted('ADMIN,USER')}">
            <form id="formLogin" action="j_security-check" method="post">
                <div class="p-field p-grid">
                    <p:outputLabel value="username" for="j_username" class="p-col-fixed" style="width: 200px"/>

                    <div class="p-col">
                        <p:inputText id="j_username"/>
                    </div>
                </div>

                <div class="p-field p-grid">
                    <p:outputLabel value="Password" for="j_password" class="p-col-fixed" style="width: 200px"/>

                    <div class="p-col">
                        <p:inputText type="password" id="j_password"/>
                    </div>
                </div>

                <div class="p-field p-grid">
                    <div class="p-col">
                        <p:commandButton onclick="submit()" value="Login" styleClass="ui-button-outlined ui-button-success"/>
                    </div>
                </div>
            </form>
        </p:panel>

        <!--ifAnyGranted se utiliza para mostrar un mensaje de bienvenida solo si el usuario tiene el rol ADMIN o USER-->
        <p:panel header="Bienvenido ya haz iniciado sesión" rendered="#{p:ifAnyGranted('ADMIN,USER')}">
            <p:linkButton outcome="index" value="volver" styleClass="p-my-2" />
        </p:panel>
    </ui:define>
</ui:composition>

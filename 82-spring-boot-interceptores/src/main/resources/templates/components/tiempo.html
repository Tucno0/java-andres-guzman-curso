<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
    <body>
        <!--th:fragment sirve para reutilizar fragmentos de código-->
        <section th:fragment="interceptor">
            <div class="alert alert-success" th:if="${tiempoTranscurrido != null}">
                <span th:text="${'Tiempo transcurrido: ' + tiempoTranscurrido + ' ms'}"></span>
            </div>
        </section>
    </body>
</html>

<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" data-bs-theme="dark">
<head th:replace="layout/layout :: head"></head>

<body>
    <header th:replace="layout/layout :: header"></header>

    <div class="container my-4">
        <h1 class="text-center mb-3 text-primary" th:text="${titulo}"></h1>

        <div class="mx-auto">
            <div th:object="${cliente}" th:remove="tag">
                <ul th:if="${#fields.hasErrors()}" class="alert alert-danger">
                    <li th:each="err : ${#fields.errors()}" th:text="${err}"></li>
                </ul>
            </div>

            <form class="" th:action="@{/form}" method="post" th:object="${cliente}" novalidate>
                <div class="row mb-3">
                    <label for="nombre" class="col-sm-2 col-form-label">Nombre</label>
                    <div class="col-sm-10">
                        <input type="text" class="form-control" id="nombre" th:field="*{nombre}">
                        <span class="text-danger" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></span>
                    </div>
                </div>

                <div class="row mb-3">
                    <label for="apellido" class="col-sm-2 col-form-label">Apellido</label>
                    <div class="col-sm-10">
                        <input type="text" class="form-control" id="apellido" th:field="*{apellido}">
                        <span class="text-danger" th:if="${#fields.hasErrors('apellido')}" th:errors="*{apellido}"></span>
                    </div>
                </div>

                <div class="row mb-3">
                    <label for="email" class="col-sm-2 col-form-label">Email</label>
                    <div class="col-sm-10">
                        <input type="email" class="form-control" id="email" th:field="*{email}">
                        <span class="text-danger" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
                    </div>
                </div>

                <div class="row mb-3">
                    <label for="date" class="col-sm-2 col-form-label">Fecha</label>
                    <div class="col-sm-10">
                        <input type="date" class="form-control" id="date" th:field="*{createAt}">
                        <span class="text-danger" th:if="${#fields.hasErrors('createAt')}" th:errors="*{createAt}"></span>
                    </div>
                </div>

<!--                <input type="hidden" th:field="*{id}">-->
                <button type="submit"  class="btn btn-primary">Crear Cliente</button>
            </form>
        </div>
    </div>

    <footer th:replace="layout/layout :: footer"></footer>
</body>
</html>

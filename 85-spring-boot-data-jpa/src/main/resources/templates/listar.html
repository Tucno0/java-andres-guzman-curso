<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" data-bs-theme="dark">
<head th:replace="layout/layout :: head"></head>

<body>
    <header th:replace="layout/layout :: header"></header>

    <main>
        <div class="container my-4">
            <h1 class="text-center mb-4 text-primary">
                Listado de clientes
            </h1>

            <table class="table table-striped">
                <tr>
                    <th>Id</th>
                    <th>Nombre</th>
                    <th>Apellido</th>
                    <th>Email</th>
                    <th>Fecha</th>
                    <th>Acciones</th>
                </tr>

                <tr th:each="cliente : ${clientes}">
                    <td th:text="${cliente.id}"></td>
                    <td th:text="${cliente.nombre}"></td>
                    <td th:text="${cliente.apellido}"></td>
                    <td th:text="${cliente.email}"></td>
                    <td th:text="${cliente.createAt}"></td>
                    <td>
                        <a class="btn btn-warning" th:href="@{/form/} + ${cliente.id}">
                            Editar
                        </a>
                        <a class="btn btn-danger"
                           th:href="@{/eliminar/} + ${cliente.id}"
                           onclick="return confirm('¿Estás seguro de eliminar el cliente?')">
                            Eliminar
                        </a>
                    </td>
                </tr>
            </table>

            <a class="btn btn-primary" th:href="@{/form}">
                Crear cliente
            </a>
        </div>
    </main>

    <footer th:replace="layout/layout :: footer"></footer>
</body>
</html>

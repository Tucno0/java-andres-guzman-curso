<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
    <input type="text" name="username" value="John Doe">
    <br>
    <input type="password" name="clave" value="12345">
    <br>
    <input type="email" name="email" value="john.doe@correo.com">
    <br>
    <input type="number" name="edad" value="30">
    <br>
    <textarea name="exp" rows="5" cols="9">... más de 10 años de experiencia ...</textarea>
    <br>
    <select name="lenguaje">
        <option value="1" selected>Java</option>
        <option value="2">Python</option>
        <option value="3">JavaScript</option>
        <option value="4">TypeScript</option>
        <option value="5">PHP</option>
    </select>
    <br>
    <input disabled name="saludo" value="Hola qué tal, este campo está deshabilitado!">
    <br>
</body>
</html>

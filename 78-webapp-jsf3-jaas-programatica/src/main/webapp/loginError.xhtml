<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/layouts/main.xhtml">
    <!-- define sirve para definir un bloque de contenido que se puede reutilizar en otras vistas -->
    <ui:define name="content">
        <p:panel header="Error Login">
            <p:staticMessage severity="error" summary="Error de autenticación" detail="Usuario o contraseña incorrectos, intente de nuevo" />
            <p:linkButton outcome="login" value="Login" styleClass="p-my-2" />
        </p:panel>
    </ui:define>
</ui:composition>

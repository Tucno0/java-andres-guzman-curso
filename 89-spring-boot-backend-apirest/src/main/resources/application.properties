spring.application.name=spring-boot-backend-apirest

# Configuración de la conexión a la base de datos
spring.datasource.url=jdbc:mysql://localhost:3306/springboot_db?useSSL=false&useTimezone=true&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=70205787
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración de Hibernate
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Configuración de la consola de la base de datos
logging.level.org.hibernate.SQL=debug
logging.level.org.hibernate.type.descriptor.sql=trace
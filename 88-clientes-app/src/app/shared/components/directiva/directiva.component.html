<button class="btn btn-primary" (click)="setHabilitar()">
  {{ habilitar ? 'Ocultar' : 'Mostrar' }}
</button>

<div class="card">
  <div class="card-header">
    Listado de cursos
  </div>

  <ul class="list-group list-group-flush" *ngIf="habilitar">
    <li class="list-group-item" *ngFor="let curso of listaCurso">
      {{ curso }}
    </li>
  </ul>
</div>

<div class="card text-bg-dark mb-3">
  <h2 class="card-header">Listado de clientes</h2>

  <div class="card-body">
    <button type="button" class="btn btn-primary" routerLink="/clientes/form">Nuevo cliente</button>
  </div>

  <div class="card-body">
    <table class="table table-striped">
      <thead>
        <tr>
          <th scope="col">id</th>
          <th scope="col">Nombre</th>
          <th scope="col">Apellido</th>
          <th scope="col">Email</th>
          <th scope="col">Fecha</th>
          <th scope="col">Acciones</th>
        </tr>
      </thead>

      <tbody>
        @for ( cliente of clientes(); track cliente.id) {
          <tr>
            <th scope="row">{{ cliente.id }}</th>
            <td>{{ cliente.nombre }}</td>
            <td>{{ cliente.apellido }}</td>
            <td>{{ cliente.email }}</td>
            <td>{{ cliente.createAt }}</td>
            <td class="d-flex justify-content-between align-items-center">
              <button type="button" class="btn btn-primary" routerLink="/clientes/form/{{ cliente.id }}">Editar</button>
              <button type="button" class="btn btn-danger" (click)="delete(cliente)">Eliminar</button>
            </td>
          </tr>
        } @empty {
          <tr>
            <td colspan="5">No hay clientes</td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>

<?xml version="1.0" encoding="utf-8" ?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
    <h:head>
        <meta charset="UTF-8"/>
        <title>#{titulo}</title>
    </h:head>

    <h:body>
        <f:metadata>
            <f:viewParam name="id" value="#{productoController.id}"/>
        </f:metadata>

        <h:panelGrid border="1">
            <f:facet name="header">
                <h:outputText value="#{titulo}"/>
            </f:facet>

            <h:form id="crearForm">
                <h:commandButton value="Crear producto" action="form.xhtml"/>
                <h:commandLink value="Crear producto" action="form.xhtml"/>
            </h:form>

            <h:outputText value="No existen productos en la base de datos" rendered="#{empty listado}"/>

            <h:dataTable value="#{listado}" var="prod" rendered="#{not empty listado}">
                <h:column>
                    <f:facet name="header">
                        <h:outputText value="Id"/>
                    </f:facet>
                    <h:outputText value="#{prod.id}"/>
                </h:column>

                <h:column>
                    <f:facet name="header">
                        <h:outputText value="Nombre"/>
                    </f:facet>
                    <h:outputText value="#{prod.nombre}"/>
                </h:column>

                <h:column>
                    <f:facet name="header">
                        <h:outputText value="Precio"/>
                    </f:facet>
                    <h:outputText value="#{prod.precio}"/>
                </h:column>

                <h:column>
                    <f:facet name="header">
                        <h:outputText value="Sku"/>
                    </f:facet>
                    <h:outputText value="#{prod.sku}"/>
                </h:column>

                <h:column>
                    <f:facet name="header">
                        <h:outputText value="Categoria"/>
                    </f:facet>
                    <h:outputText value="#{prod.categoria.nombre}"/>
                </h:column>

                <h:column>
                    <f:facet name="header">
                        <h:outputText value="Fecha"/>
                    </f:facet>
                    <h:outputText value="#{prod.fechaRegistro}">
                        <f:convertDateTime type="localDate" pattern="dd/MM/yyyy"/>
                    </h:outputText>
                </h:column>

                <h:column>
                    <f:facet name="header">
                        <h:outputText value="Editar"/>
                    </f:facet>

                    <h:form id="editarForm">
                        <h:commandLink value="Editar" action="#{productoController.editar(prod.id)}"/>
                    </h:form>
                </h:column>

                <h:column>
                    <f:facet name="header">
                        <h:outputText value="Editar"/>
                    </f:facet>

                    <h:form id="editarForm2">
                        <h:link value="Editar2" outcome="form">
                            <f:param name="id" value="#{prod.id}"/>
                        </h:link>
                    </h:form>
                </h:column>

                <h:column>
                    <f:facet name="header">
                        <h:outputText value="Eliminar"/>
                    </f:facet>

                    <h:form id="eliminarForm">
                        <h:commandLink value="Eliminar" action="#{productoController.eliminar(prod.id)}" onclick="return confirm('Estas seguro que quiere eliminar?')"/>
                    </h:form>
                </h:column>
            </h:dataTable>
        </h:panelGrid>
    </h:body>
</html>

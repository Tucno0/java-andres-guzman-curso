<!DOCTYPE html>
<html lang="#{i18nController.locale}">
<!--    f:view es la etiqueta raíz de una vista JSF. Se encarga de gestionar el ciclo de vida de la vista.-->
    <f:view xmlns="http://www.w3.org/1999/xhtml"
            xmlns:h="http://xmlns.jcp.org/jsf/html"
            xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
            xmlns:f="http://xmlns.jcp.org/jsf/core"
            xmlns:p="http://primefaces.org/ui"
            locale="#{i18nController.locale}">

        <h:head>
            <meta charset="UTF-8"/>
            <title>#{titulo}</title>

            <!-- PrimeFlex es una librería de CSS que se puede utilizar con PrimeFaces. -->
            <h:outputStylesheet library="webjars" name="primeflex/3.3.1/primeflex.min.css" />
            <!-- En JSF se puede usar la etiqueta h:outputStylesheet para referenciar archivos CSS -->
            <ui:insert name="head"/> <!-- Aquí se insertarán los estilos de las vistas -->
        </h:head>

        <h:body>
            <div class="card">
                <h:form>
                    <p:growl id="messages">
                        <!-- El componente p:autoUpdate se utiliza para actualizar los mensajes de error de forma automática en el context ajax. -->
                        <p:autoUpdate/>
                    </p:growl>

                    <p:menubar hideDelay="1000">
                        <f:facet name="start">
                            <p:graphicImage name="/img/primefaces-logo.svg" library="showcase" />
                        </f:facet>

                        <p:menuitem value="#{msg['navbar.texto.inicio']}" icon="pi pi-fw pi-home" outcome="index"/>
                        <p:menuitem value="#{msg['navbar.texto.crear']}" icon="pi pi-fw pi-plus"  onclick="PF('dialogForm').show()"/>

                        <p:menuitem icon="pi pi-fw pi-flag">
                            <p:selectOneMenu value="#{i18nController.lenguaje}"
                                             valueChangeListener="#{i18nController.selecccionarLenguaje}"
                                             onchange="submit()">
                                <f:selectItem itemValue="es" itemLabel="#{msg['navbar.texto.cambiar.lenguaje']}"/>
                                <f:selectItems value="#{i18nController.lenguajesSoportados}"/>
                            </p:selectOneMenu>
                        </p:menuitem>

                        <p:submenu label="File" icon="pi pi-fw pi-file">
                            <p:submenu label="New" icon="pi pi-fw pi-plus">
                                <p:menuitem value="Bookmark" icon="pi pi-fw pi-bookmark"/>
                                <p:menuitem value="Video" icon="pi pi-fw pi-video"/>
                            </p:submenu>
                            <p:menuitem value="Delete" icon="pi pi-fw pi-trash"/>
                            <p:divider />
                            <p:menuitem value="Export" icon="pi pi-fw pi-external-link"/>
                        </p:submenu>

                        <p:submenu label="Edit" icon="pi pi-fw pi-pencil">
                            <p:menuitem value="Left" icon="pi pi-fw pi-align-left"/>
                            <p:menuitem value="Right" icon="pi pi-fw pi-align-right"/>
                            <p:menuitem value="Center" icon="pi pi-fw pi-align-center"/>
                            <p:menuitem value="Justify" icon="pi pi-fw pi-align-justify"/>
                        </p:submenu>

                        <p:divider layout="vertical"/>

                        <p:menuitem value="Quit" icon="pi pi-fw pi-power-off"/>

                        <f:facet name="end">
                            <div class="ui-input-icon-left mr-2">
                                <i class="pi pi-fw pi-search" />
                                <p:inputText placeholder="Search"/>
                            </div>
                            <p:button value="Logout" icon="pi pi-fw pi-sign-out" styleClass="ui-button-info"/>
                        </f:facet>
                    </p:menubar>
                </h:form>

                <div class="p-mb-2">
                    <!-- El componente h:messages se utiliza para mostrar mensajes de error, información, advertencia, etc. -->
                    <p:messages globalOnly="true" showDetail="true" showSummary="true" closable="true">
                        <!-- El componente p:autoUpdate se utiliza para actualizar los mensajes de error de forma automática en el context ajax. -->
                        <p:autoUpdate/>
                    </p:messages>
                    <!-- Aquí se insertará el contenido de las vistas -->
                    <ui:insert name="content"/>
                </div>

                <div class="p-mb-2">
                    <footer style="clear: both;">
                        <div class="text-center p-3" style="background-color: rgba(0, 0, 0, 0.2);">
                            <h:graphicImage value="/resources/img/cat.jpeg" style="width: 100px;" alt="Logo cat"/>
                            © 2024
                            <h:outputText value="#{msg['footer.texto.autor']}" />
                        </div>
                    </footer>
                </div>

                <ui:insert name="scripts"/> <!-- Aquí se insertarán los scripts de las vistas -->
            </div>
        </h:body>
    </f:view>
</html>

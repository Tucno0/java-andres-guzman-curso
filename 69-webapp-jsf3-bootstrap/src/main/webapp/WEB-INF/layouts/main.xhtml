<?xml version="1.0" encoding="utf-8" ?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
<h:head>
    <meta charset="UTF-8"/>
    <title>#{titulo}</title>

    <!--    Bootstrap 5-->
<!--    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"-->
<!--          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous"/>-->

    <!-- En JSF se puede usar la etiqueta h:outputStylesheet para referenciar archivos CSS -->
    <h:outputStylesheet name="css/bootstrap.min.css"/>
    <ui:insert name="head"/> <!-- Aquí se insertarán los estilos de las vistas -->
</h:head>

<h:body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Navbar</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                    aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <h:link value="Home" outcome="index" class="nav-link active"/>
                    </li>
                    <li class="nav-item">
                        <h:link value="Crear Producto" outcome="form" class="nav-link"/>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container">
        <!-- El componente h:messages se utiliza para mostrar mensajes de error, información, advertencia, etc. -->
        <h:messages globalOnly="true" styleClass="alert" showDetail="true" showSummary="false" errorClass="alert alert-danger"
                    infoClass="alert alert-info" warnClass="alert alert-warning" fatalClass="alert alert-danger"/>
        <ui:insert name="content"/> <!-- Aquí se insertará el contenido de las vistas -->
    </div>

    <footer class="bg-body-tertiary text-center text-lg-start" style="clear: both;">
        <div class="text-center p-3" style="background-color: rgba(0, 0, 0, 0.2);">
            <h:graphicImage value="/resources/img/cat.jpeg" style="width: 100px;" alt="Logo cat"/>
            © 2024
            <h:outputText value="#{titulo}" />
        </div>
    </footer>

    <!--Bootstrap 5-->
<!--    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"-->
<!--            integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"-->
<!--            crossorigin="anonymous" />-->
    <h:outputScript name="js/bootstrap.bundle.min.js"/>
    <ui:insert name="scripts"/> <!-- Aquí se insertarán los scripts de las vistas -->
</h:body>
</html>
